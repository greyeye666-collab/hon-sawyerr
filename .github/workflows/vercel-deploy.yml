name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify lint and build
        run: |
          npm run lint
          npm run build

      - name: Check Vercel Token Secret
        id: check_secret
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VERCEL_TOKEN secret is not set in GitHub Actions yet. Add VERCEL_TOKEN in Settings -> Secrets and variables -> Actions to enable auto-deploy on push."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Vercel CLI
        if: steps.check_secret.outputs.enabled == 'true'
        run: npm install -g vercel@65.17.0

      - name: Pull Vercel Environment
        if: steps.check_secret.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_flsmt0riD8quOIJiL9RRaCfN
          VERCEL_PROJECT_ID: prj_uZ0TMJOzOwwrPLTo8nTfFLr5X5kC
        run: vercel pull --yes --environment=production

      - name: Build for Production
        if: steps.check_secret.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_flsmt0riD8quOIJiL9RRaCfN
          VERCEL_PROJECT_ID: prj_uZ0TMJOzOwwrPLTo8nTfFLr5X5kC
        run: vercel build --prod

      - name: Deploy to Vercel Production
        if: steps.check_secret.outputs.enabled == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_flsmt0riD8quOIJiL9RRaCfN
          VERCEL_PROJECT_ID: prj_uZ0TMJOzOwwrPLTo8nTfFLr5X5kC
        run: vercel deploy --prebuilt --prod --yes
