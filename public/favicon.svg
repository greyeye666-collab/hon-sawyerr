<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hon. Queenstar Maame Pokua Sawyerr Monogram">
  <defs>
    <radialGradient id="emeraldSeal" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#009E52" />
      <stop offset="52%" stop-color="#006B3F" />
      <stop offset="100%" stop-color="#003D22" />
    </radialGradient>
    <linearGradient id="goldRim" x1="12%" y1="8%" x2="88%" y2="92%">
      <stop offset="0%" stop-color="#F6E6B8" />
      <stop offset="48%" stop-color="#C9963B" />
      <stop offset="100%" stop-color="#9A6D1E" />
    </linearGradient>
    <linearGradient id="crimsonRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B91628" />
      <stop offset="50%" stop-color="#E6253A" />
      <stop offset="100%" stop-color="#B91628" />
    </linearGradient>
  </defs>

  <!-- Deep Emerald Medallion -->
  <circle cx="32" cy="32" r="29.2" fill="url(#emeraldSeal)" stroke="url(#goldRim)" stroke-width="3.2" />

  <!-- Subtle Inner Hairline Ring -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#F3E5C2" stroke-opacity="0.28" stroke-width="0.9" />

  <!-- Institutional Monogram -->
  <text
    x="32"
    y="37.8"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="700"
    font-size="24"
    letter-spacing="-0.6"
    fill="#FFFFFF"
  >QP</text>

  <!-- Subtle NDC Crimson Accent Bar -->
  <rect x="22" y="47.5" width="20" height="2.8" rx="1.4" fill="url(#crimsonRibbon)" />
</svg>
